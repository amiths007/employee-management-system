version: '3.3'

services:
  app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: .
    container_name: app
    depends_on:
      - db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=oblivion
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/employeeDB
      - SPRING_DATASOURCE_USERNAME=postgres #your required name
      - SPRING_DATASOURCE_PASSWORD=oblivion
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"

  db:
    image: postgres
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=oblivion
      - POSTGRES_DB=employeeDB